<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crossword game &middot; SORTAFUN.ORG</title>
<link rel="stylesheet" href="game.css">
<style>
  table { border-collapse: collapse; margin: 0 auto; }
  td { padding: 0; position: relative; }
  td.blank { background: #000; }
  td input {
    width: 46px; height: 46px;
    border: 2px solid #000;
    text-align: center;
    font-size: 22px;
    text-transform: uppercase;
    background: #fff;
    outline: none;
  }
  td input.good { background: #d6f5d6; }
  td input.bad  { background: #f7d6d6; }
  td .num {
    position: absolute;
    top: 1px; left: 3px;
    font-size: 10px;
    color: #333;
    pointer-events: none;
  }
  .clues {
    display: flex;
    gap: 24px;
    justify-content: center;
    margin-top: 20px;
    text-align: left;
    flex-wrap: wrap;
  }
  .clues h3 { margin: 0 0 6px; font-size: 15px; }
  .clues ol { margin: 0; padding-left: 20px; font-size: 13px; line-height: 1.7; }
  .controls { margin-top: 16px; display: flex; gap: 10px; justify-content: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>crossword game</h1>
  <p class="sub">a 5&times;5 word square. every row and column is a word.</p>

  <table id="grid"></table>

  <div class="controls">
    <button id="check">check</button>
    <button id="reveal">reveal</button>
    <button id="clearBtn">clear</button>
  </div>
  <div class="status" id="status"></div>

  <div class="clues">
    <div>
      <h3>across</h3>
      <ol id="across"></ol>
    </div>
    <div>
      <h3>down</h3>
      <ol id="down"></ol>
    </div>
  </div>

  <a class="back" href="index.html">&larr; back up the pipe</a>
</div>

<script>
const SOL = [
  "HEART",
  "EMBER",
  "ABUSE",
  "RESIN",
  "TREND",
];
const N = 5;

const ACROSS = [
  [1, "Ticker in your chest"],
  [6, "Glowing scrap in a dying fire"],
  [7, "Mistreat badly"],
  [8, "Sticky sap from pine trees"],
  [9, "The direction things are moving"],
];
const DOWN = [
  [1, "It can skip a beat"],
  [2, "Campfire leftover (yes, again)"],
  [3, "Wrongly use"],
  [4, "What a violinist rubs on the bow"],
  [5, "'#___ing' on social media"],
];

// numbers: row starts get 1,6,7,8,9 ; col starts get 1,2,3,4,5
const NUMS = {};
NUMS["0,0"] = 1;
NUMS["0,1"] = 2; NUMS["0,2"] = 3; NUMS["0,3"] = 4; NUMS["0,4"] = 5;
NUMS["1,0"] = 6; NUMS["2,0"] = 7; NUMS["3,0"] = 8; NUMS["4,0"] = 9;

const grid = document.getElementById("grid");
const inputs = [];

for (let r = 0; r < N; r++) {
  const tr = document.createElement("tr");
  inputs[r] = [];
  for (let c = 0; c < N; c++) {
    const td = document.createElement("td");
    const key = r + "," + c;
    if (NUMS[key]) {
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = NUMS[key];
      td.appendChild(num);
    }
    const inp = document.createElement("input");
    inp.maxLength = 1;
    inp.dataset.r = r;
    inp.dataset.c = c;
    inp.addEventListener("input", () => {
      inp.value = inp.value.replace(/[^a-zA-Z]/g, "").toUpperCase();
      inp.classList.remove("good", "bad");
      if (inp.value && c < N - 1) inputs[r][c + 1].focus();
    });
    inp.addEventListener("keydown", (e) => {
      const rr = +inp.dataset.r, cc = +inp.dataset.c;
      if (e.key === "ArrowRight" && cc < N - 1) inputs[rr][cc + 1].focus();
      if (e.key === "ArrowLeft" && cc > 0) inputs[rr][cc - 1].focus();
      if (e.key === "ArrowDown" && rr < N - 1) inputs[rr + 1][cc].focus();
      if (e.key === "ArrowUp" && rr > 0) inputs[rr - 1][cc].focus();
      if (e.key === "Backspace" && !inp.value && cc > 0) {
        inputs[rr][cc - 1].focus();
        e.preventDefault();
      }
    });
    td.appendChild(inp);
    tr.appendChild(td);
    inputs[r][c] = inp;
  }
  grid.appendChild(tr);
}

function fillClues(el, arr) {
  arr.forEach(([n, clue]) => {
    const li = document.createElement("li");
    li.value = n;
    li.textContent = clue;
    el.appendChild(li);
  });
}
fillClues(document.getElementById("across"), ACROSS);
fillClues(document.getElementById("down"), DOWN);

const status = document.getElementById("status");

document.getElementById("check").addEventListener("click", () => {
  let filled = 0, correct = 0;
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const inp = inputs[r][c];
      inp.classList.remove("good", "bad");
      if (!inp.value) continue;
      filled++;
      if (inp.value === SOL[r][c]) { inp.classList.add("good"); correct++; }
      else inp.classList.add("bad");
    }
  }
  if (correct === 25) status.textContent = "solved it. nice. 🟩";
  else if (filled === 0) status.textContent = "type some letters first";
  else status.textContent = correct + " / 25 letters right";
});

document.getElementById("reveal").addEventListener("click", () => {
  for (let r = 0; r < N; r++)
    for (let c = 0; c < N; c++) {
      inputs[r][c].value = SOL[r][c];
      inputs[r][c].classList.remove("bad");
      inputs[r][c].classList.add("good");
    }
  status.textContent = "there you go. cheater.";
});

document.getElementById("clearBtn").addEventListener("click", () => {
  for (let r = 0; r < N; r++)
    for (let c = 0; c < N; c++) {
      inputs[r][c].value = "";
      inputs[r][c].classList.remove("good", "bad");
    }
  status.textContent = "";
  inputs[0][0].focus();
});

inputs[0][0].focus();
</script>
</body>
</html>
