name: Realtime Database (Birdie multiplayer)

# Birdie's online play (birdie/net.js) keeps every flying player's position in
# the Firebase Realtime Database. This switches on anonymous sign-in, checks the
# database exists and uploads database.rules.json to it. Also runnable by hand
# from the Actions tab ("Run workflow").

on:
  push:
    branches: [main]
    paths:
      - "database.rules.json"
      - "tools/rtdb-setup.mjs"
      - "firebase-config.js"
      - ".github/workflows/rtdb-deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Anonymous sign-in, check the database, upload its rules
        run: node tools/rtdb-setup.mjs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
