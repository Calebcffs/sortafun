<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SORTAFUN.ORG</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    overflow: hidden;
    font-family: "Comic Sans MS", "Segoe Print", cursive;
  }
  canvas { display: block; }
  #hint {
    position: fixed;
    left: 8px;
    bottom: 6px;
    font-size: 13px;
    color: #000;
    transition: opacity .25s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">&larr; &rarr; move &nbsp;&middot;&nbsp; &uarr; / space jump &nbsp;&middot;&nbsp; press &darr; to enter &nbsp;&middot;&nbsp; click a sign</div>
<script src="firebase-config.js"></script>
<script src="leaderboard.js"></script>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const hintEl = document.getElementById("hint");

// --- palette: plain white paper, black line art ---
const INK = "#000";
const PAPER = "#fff";

// each menu sign has a black door under it. walk up, press down, next page.
const DOORS = [
  { label: "crossword game", url: "crossword.html",    btn: "assets/btn-crossword.png",    ar: 152 / 63 },
  { label: "tile slider",    url: "puzzle.html",       btn: "assets/btn-tile-slider.png",  ar: 168 / 72, game: "puzzle" },
  { label: "circuit race",   url: "driving.html",      btn: "assets/btn-circuit-race.png", ar: 178 / 69, game: "circuit" },
  { label: "typing game",    url: "typing.html",       btn: "assets/btn-typing-game.png",  ar: 173 / 65, game: "typing" },
  { label: "animation studio", url: "flipbook.html",                                       ar: 188 / 64 },
  { label: "animation gallery", url: "anim-gallery.html",                                   ar: 188 / 64 },
  { label: "forum",          url: "forum.html",        btn: "assets/btn-forum.png",        ar: 116 / 58 },
  { label: "leaderboards",   url: "leaderboards.html", btn: "assets/btn-leaderboards.png", ar: 193 / 64, recent: true },
];
DOORS.forEach((p) => { if (p.btn) { p.img = new Image(); p.img.src = p.btn; } });

// tiny leaderboard readouts under the signs — Firestore, best-effort.
// LB[game] = today's top 3 [{name,score}]; LB.recent = newest score anywhere.
const LB = { puzzle: null, circuit: null, typing: null, recent: null };
function loadLB() {
  if (!window.SortafunLB) return;
  ["puzzle", "circuit", "typing"].forEach((g) => {
    SortafunLB.top(g, "day")
      .then((rows) => { LB[g] = rows.slice(0, 3); })
      .catch(() => {});
  });
  SortafunLB.recent(1)
    .then((rows) => { LB.recent = rows[0] || null; })
    .catch(() => {});
}
loadLB();

function lbTrunc(s, n) {
  s = String(s);
  return s.length > n ? s.slice(0, n) + ".." : s;
}
function lbFmt(game, score) {
  const g = window.SortafunLB && SortafunLB.GAMES[game];
  if (!g) return String(score);
  return g.format ? g.format(score) : score + " " + g.unit;
}

// The art gallery used to be a room off to the right. It's now an easter egg:
// the potted plant in the corner is a door to gallery.html. Nothing on this
// page hints at it.

let W = 0, H = 0;
let groundY = 0;
let wallTop = 80;
let doorLayout = [];
let WORLD_W = 0;
let menuMidX = 0;
let plantX = 0;

let camX = 0;

const GRAV = 0.6;
const JUMP = 12;

const guy = {
  x: 60,
  vx: 0,
  speed: 3.2,
  yOff: 0,      // 0 = on ground, negative = airborne
  vy: 0,
  onGround: true,
  entering: false,
  enterT: 0,
  targetUrl: null,
  enterDoor: null,
};

const keys = {};
window.addEventListener("keydown", (e) => {
  keys[e.key] = true;
  if (["ArrowLeft", "ArrowRight", "ArrowDown", "ArrowUp", " "].includes(e.key)) e.preventDefault();
  if ((e.key === "ArrowUp" || e.key === "w" || e.key === "W" || e.key === " ") && !guy.entering) jump();
  if ((e.key === "ArrowDown" || e.key === "Enter") && !guy.entering) tryEnter();
});
window.addEventListener("keyup", (e) => { keys[e.key] = false; });

function jump() {
  if (guy.onGround) {
    guy.vy = -JUMP;
    guy.onGround = false;
  }
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  groundY = Math.min(H - 90, H * 0.62 + 60);
  wallTop = 80;

  // --- menu signs, hand-drawn, laid out across the first screenful ---
  const boxTop = 104;
  const n = DOORS.length;
  const gapK = 0.26;                       // gap as a fraction of sign height
  const arSum = DOORS.reduce((a, p) => a + p.ar, 0);
  const spanK = arSum + gapK * (n - 1);    // total row width = boxH * spanK
  let boxH = Math.min(84, H * 0.13);
  const maxW = W - 36;
  if (boxH * spanK > maxW) boxH = maxW / spanK;
  const gap = boxH * gapK;
  const widths = DOORS.map((p) => boxH * p.ar);
  const total = boxH * spanK;
  let x = (W - total) / 2;

  const doorH = Math.min(80, boxH * 1.05);
  const doorW = doorH * 0.46;

  doorLayout = DOORS.map((p, i) => {
    const boxX = x;
    const boxW = widths[i];
    const cx = boxX + boxW / 2;
    x += boxW + gap;
    return {
      ...p,
      boxX, boxTop, boxW, boxH,
      doorW, doorH,
      doorX: cx - doorW / 2,
      cx,
    };
  });
  menuMidX = W / 2;

  // the lobby is one screenful wide — you can't walk out of it
  WORLD_W = W;
  plantX = W - 52;

  guy.x = clamp(guy.x, 20, WORLD_W - 20);
}
window.addEventListener("resize", resize);
resize();

function hitBox(mx, my) {
  for (const p of doorLayout) {
    if (mx >= p.boxX && mx <= p.boxX + p.boxW && my >= p.boxTop && my <= p.boxTop + p.boxH)
      return p;
    if (mx >= p.doorX && mx <= p.doorX + p.doorW && my >= groundY - p.doorH && my <= groundY)
      return p;
  }
  return null;
}

// the corner plant — the hidden door to the art gallery
function hitPlant(mx, my) {
  return mx >= plantX - 20 && mx <= plantX + 18 &&
         my >= groundY - 54 && my <= groundY + 2;
}

function leaveVia(url, atX) {
  guy.entering = true;
  guy.enterT = 0;
  guy.targetUrl = url;
  guy.enterDoor = null;
  guy.x = atX;
  guy.vx = 0;
  guy.yOff = 0;
  guy.vy = 0;
  guy.onGround = true;
}

canvas.addEventListener("mousemove", (e) => {
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left + camX;
  const my = e.clientY - r.top;
  canvas.style.cursor = (hitBox(mx, my) || hitPlant(mx, my)) ? "pointer" : "default";
});

canvas.addEventListener("click", (e) => {
  if (guy.entering) return;
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left + camX;
  const my = e.clientY - r.top;
  const p = hitBox(mx, my);
  if (p) {
    leaveVia(p.url, p.cx);
    guy.enterDoor = p;
    guy.enterT = 0;
  } else if (hitPlant(mx, my)) {
    leaveVia("gallery.html", plantX);
  }
});

function nearestDoor() {
  let best = null, bd = 1e9;
  for (const p of doorLayout) {
    const d = Math.abs(guy.x - p.cx);
    if (d < bd) { bd = d; best = p; }
  }
  return { p: best, d: bd };
}

function tryEnter() {
  if (!guy.onGround) return;
  const { p, d } = nearestDoor();
  if (p && d < p.doorW * 0.9) {
    guy.entering = true;
    guy.enterT = 0;
    guy.targetUrl = p.url;
    guy.enterDoor = p;
    guy.x = p.cx;
    guy.vx = 0;
  }
}

function update() {
  if (guy.entering) {
    guy.enterT += 0.02;
    if (guy.enterT >= 1) window.location.href = guy.targetUrl;
    return;
  }
  let dir = 0;
  if (keys["ArrowLeft"] || keys["a"] || keys["A"]) dir -= 1;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) dir += 1;
  guy.vx = dir * guy.speed;
  guy.x += guy.vx;
  guy.x = clamp(guy.x, 20, WORLD_W - 20);

  guy.vy += GRAV;
  guy.yOff += guy.vy;
  if (guy.yOff >= 0) {
    guy.yOff = 0;
    guy.vy = 0;
    guy.onGround = true;
  }

  hintEl.style.opacity = guy.entering ? "0" : "0.9";
}

let t = 0;

function drawBg() {
  // the white fill is also the per-frame canvas clear — keep it unconditional
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
}

// static clipart WordArt — chunky letters with a flat grey extrusion, no motion
function drawTitle(cx, cy) {
  const text = "SORTAFUN.ORG";
  const fs = Math.min(40, Math.round(W / 20));
  ctx.save();
  ctx.translate(cx, cy);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `bold ${fs}px 'Comic Sans MS', 'Arial Black', Impact, sans-serif`;

  const depth = 7;
  ctx.fillStyle = "#c9c9c9";
  for (let i = depth; i >= 1; i--) {
    ctx.fillText(text, i * 1.6, i * 1.3);
  }

  ctx.fillStyle = PAPER;
  ctx.fillText(text, 0, 0);
  ctx.lineWidth = 1.6;
  ctx.strokeStyle = INK;
  ctx.strokeText(text, 0, 0);

  ctx.restore();
}

function draw() {
  t += 1;

  // start every frame from a known-clean context state
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  const targetCam = clamp(guy.x - W / 2, 0, Math.max(0, WORLD_W - W));
  camX += (targetCam - camX) * 0.16;
  if (Math.abs(targetCam - camX) < 0.4) camX = targetCam;

  drawBg();

  // ---------- world space ----------
  ctx.save();
  ctx.translate(-camX, 0);

  ctx.strokeStyle = INK;
  ctx.fillStyle = INK;
  ctx.lineWidth = 2;
  ctx.textAlign = "center";

  drawTitle(menuMidX, 52);

  // menu signs — hand-drawn buttons, cut to their wonky outline
  for (let i = 0; i < doorLayout.length; i++) {
    const p = doorLayout[i];
    if (p.img && p.img.complete && p.img.naturalWidth) {
      ctx.drawImage(p.img, p.boxX, p.boxTop, p.boxW, p.boxH);
    } else {
      // no hand-drawn button art — draw a wonky labelled sign instead
      ctx.save();
      ctx.strokeStyle = INK;
      ctx.fillStyle = PAPER;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.boxX + 3, p.boxTop + 1);
      ctx.lineTo(p.boxX + p.boxW - 1, p.boxTop + 4);
      ctx.lineTo(p.boxX + p.boxW - 3, p.boxTop + p.boxH - 1);
      ctx.lineTo(p.boxX + 1, p.boxTop + p.boxH - 3);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = INK;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const fs = Math.min(17, p.boxH * 0.26);
      ctx.font = fs + "px 'Comic Sans MS', 'Segoe Print', cursive";
      const words = p.label.split(" ");
      const mid = p.boxTop + p.boxH / 2;
      if (words.length > 1) {
        ctx.fillText(words[0], p.cx, mid - fs * 0.6);
        ctx.fillText(words.slice(1).join(" "), p.cx, mid + fs * 0.6);
      } else {
        ctx.fillText(p.label, p.cx, mid);
      }
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    }
  }

  // the corner plant — looks like decor, actually the way to the art gallery
  drawPlant(plantX, groundY);

  // black doors standing on the floor under each sign
  const { p: near, d: nearD } = nearestDoor();
  for (const p of doorLayout) {
    const isEnterDoor = guy.entering && p === guy.enterDoor;
    const open = isEnterDoor ? clamp(guy.enterT * 1.5, 0, 1) : 0;
    const lit = !guy.entering && p === near && nearD < p.doorW * 0.9 && guy.onGround;
    drawDoor(p, lit, open);
  }

  drawGuy();

  drawSignboards();

  ctx.restore();
  // ---------- /world space ----------

  // floor line — continuous everywhere, so it stays in screen space
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();
}

function drawDoor(p, lit, open) {
  open = open || 0;
  const x = p.doorX, w = p.doorW, h = p.doorH;
  const y = groundY - h;
  const r = Math.min(10, w * 0.4);
  const ease = 1 - Math.pow(1 - open, 3);

  // outer frame
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2;
  ctx.strokeRect(x - 4, y - 4, w + 8, h + 4);

  // lit doorway behind the panel, revealed as it swings (white = light beyond)
  if (ease > 0.01) {
    ctx.fillStyle = PAPER;
    ctx.fillRect(x, y, w, h);
  }

  // the panel — hinged at the left edge, foreshortening to a thin strip
  const pw = w * (1 - ease * 0.86);
  const lift = ease * 3;
  const rr = Math.min(r, pw) * (1 - ease);   // right corner squares off as it turns
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.moveTo(x, groundY);
  ctx.lineTo(x, y + Math.min(r, pw));
  ctx.quadraticCurveTo(x, y, x + Math.min(r, pw), y);
  ctx.lineTo(x + pw - rr, y - lift);
  ctx.quadraticCurveTo(x + pw, y - lift, x + pw, y - lift + rr);
  ctx.lineTo(x + pw, groundY);
  ctx.closePath();
  ctx.fill();

  // lit outer edge of the swinging panel
  if (ease > 0.02) {
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x + pw, y - lift);
    ctx.lineTo(x + pw, groundY);
    ctx.stroke();
  }

  // knob near the free edge
  ctx.fillStyle = PAPER;
  ctx.beginPath();
  ctx.arc(x + pw - Math.min(7, pw * 0.3), y + h * 0.55, 2.6, 0, Math.PI * 2);
  ctx.fill();

  if (lit) {
    ctx.fillStyle = INK;
    ctx.textAlign = "center";
    ctx.font = "12px 'Comic Sans MS', 'Segoe Print', cursive";
    ctx.fillText("press ↓ to enter", p.cx, y - 10);
    ctx.font = "17px 'Comic Sans MS', 'Segoe Print', cursive";
  }
}

// tiny leaderboard readouts pinned under each sign (world space)
function drawSignboards() {
  if (!window.SortafunLB) return;
  ctx.save();
  ctx.textAlign = "center";
  for (const p of doorLayout) {
    const lines = [];
    if (p.game && LB[p.game] && LB[p.game].length) {
      lines.push({ t: "today", head: true });
      LB[p.game].forEach((r, i) => {
        lines.push({ t: (i + 1) + ". " + lbTrunc(r.name, 8) + "  " + lbFmt(p.game, r.score) });
      });
    } else if (p.recent && LB.recent) {
      const r = LB.recent;
      const gl = (SortafunLB.GAMES[r.game] || {}).label || r.game;
      lines.push({ t: "latest score", head: true });
      lines.push({ t: lbTrunc(r.name, 14) });
      lines.push({ t: gl + "  " + lbFmt(r.game, r.score) });
    }
    if (!lines.length) continue;

    let ly = p.boxTop + p.boxH + 10;
    for (const ln of lines) {
      ctx.fillStyle = ln.head ? "#999" : "#555";
      ctx.font = (ln.head ? "8px" : "9px") + " 'Comic Sans MS', 'Segoe Print', cursive";
      ctx.fillText(ln.t, p.cx, ly);
      ly += ln.head ? 9 : 11;
    }
  }
  ctx.restore();
}

function drawPlant(x, baseY) {
  ctx.strokeStyle = INK;
  ctx.fillStyle = PAPER;
  ctx.lineWidth = 2;
  // pot
  ctx.beginPath();
  ctx.moveTo(x - 12, baseY - 20);
  ctx.lineTo(x + 12, baseY - 20);
  ctx.lineTo(x + 8, baseY);
  ctx.lineTo(x - 8, baseY);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // leaves
  ctx.beginPath();
  ctx.moveTo(x, baseY - 20);
  ctx.quadraticCurveTo(x - 16, baseY - 34, x - 6, baseY - 48);
  ctx.moveTo(x, baseY - 20);
  ctx.quadraticCurveTo(x + 16, baseY - 34, x + 6, baseY - 48);
  ctx.moveTo(x, baseY - 20);
  ctx.lineTo(x, baseY - 44);
  ctx.stroke();
}

function drawGuy() {
  ctx.save();
  ctx.strokeStyle = INK;
  ctx.fillStyle = PAPER;
  ctx.lineWidth = 2;

  // fade into the doorway on entry
  if (guy.entering) ctx.globalAlpha = Math.max(0, 1 - guy.enterT * 1.15);

  let feetY = groundY + guy.yOff;
  let bob = 0;
  if (!guy.entering && guy.vx !== 0 && guy.onGround) bob = Math.sin(t * 0.3) * 2;
  const airborne = !guy.onGround && !guy.entering;

  const x = guy.x;
  const headR = 9;
  const headCY = feetY - 46 + bob;
  const hipY = feetY - 20 + bob;

  ctx.beginPath();
  ctx.arc(x, headCY, headR, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x, headCY + headR);
  ctx.lineTo(x, hipY);
  ctx.stroke();

  const swing = airborne ? -8 : (guy.vx !== 0 ? Math.sin(t * 0.3) * 6 : 3);
  ctx.beginPath();
  ctx.moveTo(x, hipY - 14);
  ctx.lineTo(x - 9, hipY - 6 + swing);
  ctx.moveTo(x, hipY - 14);
  ctx.lineTo(x + 9, hipY - 6 - swing);
  ctx.stroke();

  let legSwing;
  if (airborne) legSwing = guy.vy < 0 ? 3 : 9;
  else legSwing = guy.vx !== 0 ? Math.sin(t * 0.3) * 7 : 5;
  ctx.beginPath();
  ctx.moveTo(x, hipY);
  ctx.lineTo(x - legSwing, feetY + bob);
  ctx.moveTo(x, hipY);
  ctx.lineTo(x + legSwing, feetY + bob);
  ctx.stroke();

  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function loop() {
  try {
    update();
    draw();
  } catch (err) {
    console.error(err);   // never let one bad frame freeze input
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
