<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SORTAFUN.ORG</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05060f;
    overflow: hidden;
    font-family: "Comic Sans MS", "Segoe Print", cursive;
  }
  canvas { display: block; }
  #hint {
    position: fixed;
    left: 8px;
    bottom: 6px;
    font-size: 13px;
    color: #9fb4ff;
    text-shadow: 0 0 6px #1b2b8a;
    transition: opacity .25s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">&larr; &rarr; move &nbsp;&middot;&nbsp; &uarr; / space jump &nbsp;&middot;&nbsp; &darr; enter pipe &nbsp;&middot;&nbsp; click a sign &nbsp;&middot;&nbsp; run right for the gallery</div>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const hintEl = document.getElementById("hint");

// --- palette: white paper world repainted for deep space ---
const INK = "#eafcff";     // light line art (was #000)
const PAPER = "#0a0c1a";   // dark fills (was #fff)
const GLOW = "#39ff14";    // radioactive early-web green

const PIPES = [
  { label: "crossword game", url: "crossword.html",    btn: "assets/btn-crossword.png",    ar: 152 / 63 },
  { label: "tile slider",    url: "puzzle.html",       btn: "assets/btn-tile-slider.png",  ar: 168 / 72 },
  { label: "circuit race",   url: "driving.html",      btn: "assets/btn-circuit-race.png", ar: 178 / 69 },
  { label: "typing game",    url: "typing.html",       btn: "assets/btn-typing-game.png",  ar: 173 / 65 },
  { label: "forum",          url: "forum.html",        btn: "assets/btn-forum.png",        ar: 116 / 58 },
  { label: "leaderboards",   url: "leaderboards.html", btn: "assets/btn-leaderboards.png", ar: 193 / 64 },
];
PIPES.forEach((p) => { p.img = new Image(); p.img.src = p.btn; });

const pipeImg = new Image(); pipeImg.src = "assets/pipe.png";
const PIPE_AR = 44 / 31;
const signImg = new Image(); signImg.src = "assets/art-gallery-sign.png";
const SIGN_AR = 252 / 124;

// gallery photos live in art/ (1200x846 each). caption text is deliberately
// illegible — squiggles on a little plaque.
const ART = [
  { src: "art/1.jpg" },
  { src: "art/2.jpg" },
  { src: "art/3.jpg" },
  { src: "art/4.jpg" },
];
ART.forEach((a) => { a.img = new Image(); a.img.src = a.src; });
const ART_RATIO = 1200 / 846;

let W = 0, H = 0;
let groundY = 0;
let wallTop = 80;
let pipeLayout = [];
let frames = [];
let WORLD_W = 0;
let menuMidX = 0, galleryMidX = 0;
let signRect = null;
let stars = [];

let camX = 0;
let previewT = 0;      // 0 = preview tucked below the floor, 1 = fully up
let activeArt = null;  // frame the guy is currently standing under
let shownArt = null;   // last art shown, kept while the panel slides away

const GRAV = 0.6;
const JUMP = 12;

const guy = {
  x: 60,
  vx: 0,
  speed: 3.2,
  yOff: 0,      // 0 = on ground, negative = airborne
  vy: 0,
  onGround: true,
  entering: false,
  enterT: 0,
  targetUrl: null,
};

const keys = {};
window.addEventListener("keydown", (e) => {
  keys[e.key] = true;
  if (["ArrowLeft", "ArrowRight", "ArrowDown", "ArrowUp", " "].includes(e.key)) e.preventDefault();
  if ((e.key === "ArrowUp" || e.key === "w" || e.key === "W" || e.key === " ") && !guy.entering) jump();
  if ((e.key === "ArrowDown" || e.key === "Enter") && !guy.entering) tryEnter();
});
window.addEventListener("keyup", (e) => { keys[e.key] = false; });

function jump() {
  if (guy.onGround) {
    guy.vy = -JUMP;
    guy.onGround = false;
  }
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function seedStars() {
  stars = [];
  let seed = 0x9e3779b9;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const n = Math.round((W * H) / 4200);
  for (let i = 0; i < n; i++) {
    stars.push({
      x: rnd() * W,
      y: rnd() * H,
      r: rnd() * 1.7 + 0.4,
      tw: rnd() * Math.PI * 2,
      layer: rnd() < 0.55 ? 0.25 : 0.6,   // parallax factor
      warm: rnd() < 0.3,
    });
  }
}

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  groundY = Math.min(H - 90, H * 0.62 + 60);
  wallTop = 80;

  // --- menu signs, hand-drawn, laid out across the first screenful ---
  const boxTop = 104;
  const n = PIPES.length;
  const gapK = 0.26;                       // gap as a fraction of sign height
  const arSum = PIPES.reduce((a, p) => a + p.ar, 0);
  const spanK = arSum + gapK * (n - 1);    // total row width = boxH * spanK
  let boxH = Math.min(84, H * 0.13);
  const maxW = W - 36;
  if (boxH * spanK > maxW) boxH = maxW / spanK;
  const gap = boxH * gapK;
  const widths = PIPES.map((p) => boxH * p.ar);
  const total = boxH * spanK;
  let x = (W - total) / 2;

  const pipeW = Math.min(56, boxH * 0.7);
  const pipeH = pipeW / PIPE_AR;

  pipeLayout = PIPES.map((p, i) => {
    const boxX = x;
    const boxW = widths[i];
    const cx = boxX + boxW / 2;
    x += boxW + gap;
    return {
      ...p,
      boxX, boxTop, boxW, boxH,
      pipeW, pipeH,
      pipeX: cx - pipeW / 2,
      cx,
    };
  });
  menuMidX = W / 2;

  // --- art gallery sign, pinned to the top-right corner ---
  const signW = Math.min(158, W * 0.20);
  const signH = signW / SIGN_AR;
  signRect = { x: W - signW - 14, y: 8, w: signW, h: signH };

  // --- gallery, off to the right ---
  const frameH = Math.min((groundY - wallTop) * 0.60, W * 0.27);
  const frameW = frameH * ART_RATIO;
  const galleryX0 = W + 250;
  const frameGap = frameW + Math.max(70, W * 0.10);

  frames = ART.map((a, i) => {
    const cx = galleryX0 + frameW / 2 + i * frameGap;
    return { art: a, cx, w: frameW, h: frameH };
  });

  const lastRight = frames[frames.length - 1].cx + frameW / 2;
  WORLD_W = lastRight + 190;
  galleryMidX = (galleryX0 + lastRight) / 2;

  guy.x = clamp(guy.x, 20, WORLD_W - 20);
  seedStars();
}
window.addEventListener("resize", resize);
resize();

function hitBox(mx, my) {
  for (const p of pipeLayout) {
    if (mx >= p.boxX && mx <= p.boxX + p.boxW && my >= p.boxTop && my <= p.boxTop + p.boxH)
      return p;
    if (mx >= p.pipeX && mx <= p.pipeX + p.pipeW && my >= groundY - p.pipeH && my <= groundY)
      return p;
  }
  return null;
}

canvas.addEventListener("mousemove", (e) => {
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left + camX;
  const my = e.clientY - r.top;
  canvas.style.cursor = hitBox(mx, my) ? "pointer" : "default";
});

canvas.addEventListener("click", (e) => {
  if (guy.entering) return;
  const r = canvas.getBoundingClientRect();
  const p = hitBox(e.clientX - r.left + camX, e.clientY - r.top);
  if (p) {
    guy.entering = true;
    guy.enterT = 0;
    guy.targetUrl = p.url;
    guy.x = p.cx;
    guy.vx = 0;
    guy.yOff = 0;
    guy.vy = 0;
    guy.onGround = true;
  }
});

function nearestPipe() {
  let best = null, bd = 1e9;
  for (const p of pipeLayout) {
    const d = Math.abs(guy.x - p.cx);
    if (d < bd) { bd = d; best = p; }
  }
  return { p: best, d: bd };
}

function tryEnter() {
  if (!guy.onGround) return;
  const { p, d } = nearestPipe();
  if (p && d < 34) {
    guy.entering = true;
    guy.enterT = 0;
    guy.targetUrl = p.url;
    guy.x = p.cx;
    guy.vx = 0;
  }
}

function update() {
  if (guy.entering) {
    guy.enterT += 0.02;
    if (guy.enterT >= 1) window.location.href = guy.targetUrl;
    return;
  }
  let dir = 0;
  if (keys["ArrowLeft"] || keys["a"] || keys["A"]) dir -= 1;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) dir += 1;
  guy.vx = dir * guy.speed;
  guy.x += guy.vx;
  guy.x = clamp(guy.x, 20, WORLD_W - 20);

  guy.vy += GRAV;
  guy.yOff += guy.vy;
  if (guy.yOff >= 0) {
    guy.yOff = 0;
    guy.vy = 0;
    guy.onGround = true;
  }

  // which picture are we standing under?
  activeArt = null;
  if (guy.onGround) {
    let bd = 1e9;
    for (const f of frames) {
      const d = Math.abs(guy.x - f.cx);
      if (d < f.w * 0.58 && d < bd) { bd = d; activeArt = f; }
    }
  }
  if (activeArt) shownArt = activeArt;
  previewT += ((activeArt ? 1 : 0) - previewT) * 0.14;
  hintEl.style.opacity = previewT > 0.05 ? "0" : "0.9";
}

let t = 0;

function drawStars() {
  for (const s of stars) {
    let sx = ((s.x - camX * s.layer) % W + W) % W;
    const tw = 0.45 + 0.55 * Math.sin(t * 0.05 + s.tw);
    ctx.globalAlpha = 0.25 + tw * 0.75;
    ctx.fillStyle = s.warm ? "#ffd9a8" : (s.layer < 0.4 ? "#9fb4ff" : "#ffffff");
    ctx.fillRect(sx, s.y, s.r, s.r);
    if (s.r > 1.5) {
      ctx.globalAlpha *= 0.5;
      ctx.fillRect(sx - s.r, s.y + s.r * 0.5, s.r * 3, 0.7);
      ctx.fillRect(sx + s.r * 0.5, s.y - s.r, 0.7, s.r * 3);
    }
  }
  ctx.globalAlpha = 1;
}

function drawSpaceBg() {
  ctx.fillStyle = "#05060f";
  ctx.fillRect(0, 0, W, H);
  // a couple of cheap nebula blooms, gently drifting with the camera
  const blobs = [
    { x: W * 0.20 - camX * 0.15, y: H * 0.30, r: W * 0.45, c: "rgba(90,30,160,0.30)" },
    { x: W * 0.85 - camX * 0.10, y: H * 0.65, r: W * 0.40, c: "rgba(15,120,170,0.25)" },
    { x: W * 0.55 - camX * 0.20, y: H * 0.15, r: W * 0.35, c: "rgba(200,40,120,0.18)" },
  ];
  for (const b of blobs) {
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    g.addColorStop(0, b.c);
    g.addColorStop(1, "rgba(5,6,15,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  drawStars();
}

function drawSpinTitle(cx, cy) {
  const text = "SORTAFUN.ORG";
  const sx = Math.cos(t * 0.03);            // horizontal squash → WordArt spin
  const spin = Math.abs(sx) < 0.02 ? (sx < 0 ? -0.02 : 0.02) : sx;

  const fs = Math.min(40, Math.round(W / 20));
  ctx.save();
  ctx.translate(cx, cy);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `bold ${fs}px 'Comic Sans MS', 'Arial Black', Impact, sans-serif`;

  const depth = 9;
  for (let i = depth; i >= 1; i--) {
    const k = i / depth;                    // 1 = far back, near 0 = front
    ctx.save();
    ctx.transform(spin, 0, 0, 1, 3 * i, 2.4 * i);
    ctx.fillStyle = `rgb(${Math.round(30 + 40 * (1 - k))}, ${Math.round(6 + 18 * (1 - k))}, ${Math.round(70 + 60 * (1 - k))})`;
    ctx.fillText(text, 0, 0);
    ctx.restore();
  }

  // shiny front face
  ctx.save();
  ctx.transform(spin, 0, 0, 1, 0, 0);
  const grad = ctx.createLinearGradient(0, -22, 0, 22);
  grad.addColorStop(0, "#fff6b0");
  grad.addColorStop(0.45, "#ffd23f");
  grad.addColorStop(0.55, "#ff9de2");
  grad.addColorStop(1, "#7ce7ff");
  ctx.fillStyle = grad;
  ctx.fillText(text, 0, 0);
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = "#2a0b4e";
  ctx.strokeText(text, 0, 0);
  // hot glint
  ctx.restore();

  ctx.restore();
}

function draw() {
  t += 1;

  // start every frame from a known-clean context state
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  const pulse = 0.5 + 0.5 * Math.sin(t * 0.06);   // shared glow throb

  const targetCam = clamp(guy.x - W / 2, 0, Math.max(0, WORLD_W - W));
  camX += (targetCam - camX) * 0.16;
  if (Math.abs(targetCam - camX) < 0.4) camX = targetCam;

  drawSpaceBg();

  // ---------- world space ----------
  ctx.save();
  ctx.translate(-camX, 0);

  ctx.strokeStyle = INK;
  ctx.fillStyle = INK;
  ctx.lineWidth = 2;
  ctx.textAlign = "center";

  drawSpinTitle(menuMidX, 52);

  // art gallery sign, pinned by the title
  if (signRect && signImg.complete && signImg.naturalWidth) {
    ctx.save();
    ctx.shadowColor = "#7ce7ff";
    ctx.shadowBlur = 12 + pulse * 8;
    ctx.drawImage(signImg, signRect.x, signRect.y, signRect.w, signRect.h);
    ctx.restore();
  }

  ctx.font = "30px 'Comic Sans MS', 'Segoe Print', cursive";
  ctx.fillStyle = INK;
  ctx.fillText("art gallery", galleryMidX, 52);

  // signposts in the gap between the two rooms
  ctx.font = "15px 'Comic Sans MS', 'Segoe Print', cursive";
  ctx.fillStyle = "#7f8bd6";
  ctx.textAlign = "left";
  ctx.fillText("the art gallery, this way  →", W + 40, groundY - 42);
  ctx.fillText("←  back to the lobby", W + 40, groundY - 16);
  ctx.textAlign = "center";
  ctx.fillStyle = INK;

  // menu signs — hand-drawn buttons, cut to their wonky outline and glowing
  for (let i = 0; i < pipeLayout.length; i++) {
    const p = pipeLayout[i];
    if (p.img.complete && p.img.naturalWidth) {
      const hue = (i / pipeLayout.length) * 300 + t * 0.6;
      ctx.save();
      // two passes of glow so it reads against the stars
      ctx.shadowColor = `hsl(${hue}, 100%, 65%)`;
      ctx.shadowBlur = 14 + pulse * 12;
      ctx.drawImage(p.img, p.boxX, p.boxTop, p.boxW, p.boxH);
      ctx.shadowBlur = 6 + pulse * 6;
      ctx.drawImage(p.img, p.boxX, p.boxTop, p.boxW, p.boxH);
      ctx.restore();
    } else {
      ctx.strokeStyle = INK;
      ctx.strokeRect(p.boxX, p.boxTop, p.boxW, p.boxH);
    }
  }

  // gallery frames on the wall
  for (const f of frames) {
    drawFrame(f);
  }

  // a little potted plant by the gallery door, for coziness
  drawPlant(frames[0].cx - frames[0].w / 2 - 34, groundY);

  // Mario pipes poking out of the floor
  const { p: near, d: nearD } = nearestPipe();
  for (const p of pipeLayout) {
    if (pipeImg.complete && pipeImg.naturalWidth) {
      ctx.drawImage(pipeImg, p.pipeX, groundY - p.pipeH, p.pipeW, p.pipeH);
    } else {
      ctx.fillStyle = "#1faf3a";
      ctx.fillRect(p.pipeX, groundY - p.pipeH, p.pipeW, p.pipeH);
    }
    if (p === near && nearD < 34 && guy.onGround && !guy.entering) {
      ctx.fillStyle = GLOW;
      ctx.font = "20px 'Comic Sans MS', cursive";
      ctx.fillText("↓", p.cx, groundY - p.pipeH - 10);
      ctx.font = "17px 'Comic Sans MS', 'Segoe Print', cursive";
    }
  }

  drawGuy();

  ctx.restore();
  // ---------- /world space ----------

  // floor line — continuous everywhere, so it stays in screen space
  ctx.strokeStyle = GLOW;
  ctx.lineWidth = 2;
  ctx.shadowColor = GLOW;
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();
  ctx.shadowBlur = 0;

  drawPreview();
}

// cover-fit an image into a rect, cropping the overflow
function drawImageCover(img, x, y, w, h) {
  if (!img.complete || !img.naturalWidth) {
    ctx.fillStyle = "#1a1d33";
    ctx.fillRect(x, y, w, h);
    return;
  }
  const ir = img.naturalWidth / img.naturalHeight;
  const rr = w / h;
  let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
  if (ir > rr) { sw = sh * rr; sx = (img.naturalWidth - sw) / 2; }
  else { sh = sw / rr; sy = (img.naturalHeight - sh) / 2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

function drawFrame(f) {
  const x = f.cx - f.w / 2;
  const y = wallTop + 6;

  // hanging wire
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(f.cx - f.w * 0.28, y);
  ctx.lineTo(f.cx, y - 16);
  ctx.lineTo(f.cx + f.w * 0.28, y);
  ctx.stroke();

  // frame + mat + photo
  ctx.fillStyle = "#1a1208";
  ctx.fillRect(x - 6, y - 6, f.w + 12, f.h + 12);
  ctx.fillStyle = "#fff";
  ctx.fillRect(x - 3, y - 3, f.w + 6, f.h + 6);
  drawImageCover(f.art.img, x, y, f.w, f.h);
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, f.w, f.h);

  // illegible plaque under the frame
  const pw = 96, ph = 26;
  const py = y + f.h + 12;
  ctx.fillStyle = "#e9e4d0";
  ctx.fillRect(f.cx - pw / 2, py, pw, ph);
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(f.cx - pw / 2, py, pw, ph);
  squiggle(f.cx - pw / 2 + 8, py + 9, pw - 16, 1.4, 3, "#555");
  squiggle(f.cx - pw / 2 + 8, py + 17, pw - 22, 1.4, 3, "#555");
}

// a wobbly horizontal scribble standing in for text
function squiggle(x, y, w, amp, waves, color) {
  ctx.strokeStyle = color || INK;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  const steps = Math.max(12, Math.floor(w / 4));
  for (let i = 0; i <= steps; i++) {
    const px = x + (w * i) / steps;
    const py = y + Math.sin((i / steps) * Math.PI * 2 * waves) * amp;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();
}

function drawPlant(x, baseY) {
  ctx.strokeStyle = INK;
  ctx.fillStyle = PAPER;
  ctx.lineWidth = 2;
  // pot
  ctx.beginPath();
  ctx.moveTo(x - 12, baseY - 20);
  ctx.lineTo(x + 12, baseY - 20);
  ctx.lineTo(x + 8, baseY);
  ctx.lineTo(x - 8, baseY);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // leaves
  ctx.beginPath();
  ctx.moveTo(x, baseY - 20);
  ctx.quadraticCurveTo(x - 16, baseY - 34, x - 6, baseY - 48);
  ctx.moveTo(x, baseY - 20);
  ctx.quadraticCurveTo(x + 16, baseY - 34, x + 6, baseY - 48);
  ctx.moveTo(x, baseY - 20);
  ctx.lineTo(x, baseY - 44);
  ctx.stroke();
}

function drawPreview() {
  if (previewT < 0.02 || !shownArt) return;

  const bandH = H - groundY;
  const ease = 1 - Math.pow(1 - previewT, 2);
  const slide = (1 - ease) * bandH;
  const alpha = clamp(previewT * 1.4, 0, 1);

  ctx.save();
  ctx.globalAlpha = alpha;

  const pad = 14;
  const photoH = Math.min(bandH - pad * 2, 240);
  const photoW = photoH * ART_RATIO;
  const capW = Math.min(W * 0.32, 300);
  const total = photoW + 26 + capW;
  const x0 = (W - total) / 2;
  const y0 = groundY + pad + slide;

  // backing panel so the photo reads against the stars
  ctx.fillStyle = "rgba(8,10,26,0.92)";
  ctx.fillRect(0, groundY + 1, W, bandH);

  // photo, contained, framed
  ctx.fillStyle = "#1a1208";
  ctx.fillRect(x0 - 4, y0 - 4, photoW + 8, photoH + 8);
  const img = shownArt.art.img;
  if (img.complete && img.naturalWidth) {
    ctx.drawImage(img, x0, y0, photoW, photoH);
  } else {
    ctx.fillStyle = "#1a1d33";
    ctx.fillRect(x0, y0, photoW, photoH);
  }

  // illegible caption block
  const cx = x0 + photoW + 26;
  const lines = 4;
  for (let i = 0; i < lines; i++) {
    const ly = y0 + 14 + (photoH - 24) * (i / (lines - 1));
    squiggle(cx, ly, capW * (i === lines - 1 ? 0.55 : 0.92), 2, 4 + i, INK);
  }

  ctx.restore();
}

function drawGuy() {
  ctx.save();
  ctx.strokeStyle = INK;
  ctx.fillStyle = PAPER;
  ctx.lineWidth = 2;

  let feetY = groundY + guy.yOff;
  let bob = 0;
  if (!guy.entering && guy.vx !== 0 && guy.onGround) bob = Math.sin(t * 0.3) * 2;
  const airborne = !guy.onGround && !guy.entering;

  if (guy.entering) {
    const { p } = nearestPipe();
    feetY = groundY + guy.enterT * 60;
    ctx.beginPath();
    ctx.rect(p.pipeX - 1, groundY - p.pipeH, p.pipeW + 2, p.pipeH + 62);
    ctx.clip();
  }

  const x = guy.x;
  const headR = 9;
  const headCY = feetY - 46 + bob;
  const hipY = feetY - 20 + bob;

  ctx.beginPath();
  ctx.arc(x, headCY, headR, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x, headCY + headR);
  ctx.lineTo(x, hipY);
  ctx.stroke();

  const swing = airborne ? -8 : (guy.vx !== 0 ? Math.sin(t * 0.3) * 6 : 3);
  ctx.beginPath();
  ctx.moveTo(x, hipY - 14);
  ctx.lineTo(x - 9, hipY - 6 + swing);
  ctx.moveTo(x, hipY - 14);
  ctx.lineTo(x + 9, hipY - 6 - swing);
  ctx.stroke();

  let legSwing;
  if (airborne) legSwing = guy.vy < 0 ? 3 : 9;
  else legSwing = guy.vx !== 0 ? Math.sin(t * 0.3) * 7 : 5;
  ctx.beginPath();
  ctx.moveTo(x, hipY);
  ctx.lineTo(x - legSwing, feetY + bob);
  ctx.moveTo(x, hipY);
  ctx.lineTo(x + legSwing, feetY + bob);
  ctx.stroke();

  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function loop() {
  try {
    update();
    draw();
  } catch (err) {
    console.error(err);   // never let one bad frame freeze input
  }
  requestAnimationFrame(loop);
}
loop();
</script>
