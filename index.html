<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SORTAFUN.ORG</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    overflow: hidden;
    font-family: "Comic Sans MS", "Segoe Print", cursive;
  }
  canvas { display: block; }
  #hint {
    position: fixed;
    left: 8px;
    bottom: 6px;
    font-size: 13px;
    color: #444;
    transition: opacity .25s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">&larr; &rarr; move &nbsp;&middot;&nbsp; &uarr; / space jump &nbsp;&middot;&nbsp; &darr; enter pipe &nbsp;&middot;&nbsp; click a box &nbsp;&middot;&nbsp; run right for the gallery</div>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const hintEl = document.getElementById("hint");

const PIPES = [
  { label: "crossword game",    url: "crossword.html" },
  { label: "puzzle of the day",  url: "puzzle.html" },
  { label: "driving game",       url: "driving.html" },
  { label: "typing game",        url: "typing.html" },
  { label: "forum",              url: "forum.html" },
  { label: "leaderboards",       url: "leaderboards.html" },
];

// gallery photos live in art/ (1200x846 each). caption text is deliberately
// illegible — squiggles on a little plaque.
const ART = [
  { src: "art/1.jpg" },
  { src: "art/2.jpg" },
  { src: "art/3.jpg" },
  { src: "art/4.jpg" },
];
ART.forEach((a) => { a.img = new Image(); a.img.src = a.src; });
const ART_RATIO = 1200 / 846;

let W = 0, H = 0;
let groundY = 0;
let wallTop = 80;
let pipeLayout = [];
let frames = [];
let WORLD_W = 0;
let menuMidX = 0, galleryMidX = 0;

let camX = 0;
let previewT = 0;      // 0 = preview tucked below the floor, 1 = fully up
let activeArt = null;  // frame the guy is currently standing under
let shownArt = null;   // last art shown, kept while the panel slides away

const GRAV = 0.6;
const JUMP = 12;

const guy = {
  x: 60,
  vx: 0,
  speed: 3.2,
  yOff: 0,      // 0 = on ground, negative = airborne
  vy: 0,
  onGround: true,
  entering: false,
  enterT: 0,
  targetUrl: null,
};

const keys = {};
window.addEventListener("keydown", (e) => {
  keys[e.key] = true;
  if (["ArrowLeft", "ArrowRight", "ArrowDown", "ArrowUp", " "].includes(e.key)) e.preventDefault();
  if ((e.key === "ArrowUp" || e.key === "w" || e.key === "W" || e.key === " ") && !guy.entering) jump();
  if ((e.key === "ArrowDown" || e.key === "Enter") && !guy.entering) tryEnter();
});
window.addEventListener("keyup", (e) => { keys[e.key] = false; });

function jump() {
  if (guy.onGround) {
    guy.vy = -JUMP;
    guy.onGround = false;
  }
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  groundY = Math.min(H - 90, H * 0.62 + 60);
  wallTop = 80;

  // --- menu boxes, laid out across the first screenful ---
  const boxTop = 90;
  const boxH = 90;
  const gap = 24;
  const totalGap = gap * (PIPES.length + 1);
  const boxW = Math.min(180, (W - totalGap) / PIPES.length);
  const usedW = boxW * PIPES.length + gap * (PIPES.length - 1);
  const startX = (W - usedW) / 2;

  pipeLayout = PIPES.map((p, i) => {
    const boxX = startX + i * (boxW + gap);
    const cx = boxX + boxW / 2;
    return {
      ...p,
      boxX, boxTop, boxW, boxH,
      pipeW: 52,
      pipeH: 34,
      pipeX: cx - 26,
      cx,
    };
  });
  menuMidX = W / 2;

  // --- gallery, off to the right ---
  const frameH = Math.min((groundY - wallTop) * 0.60, W * 0.27);
  const frameW = frameH * ART_RATIO;
  const galleryX0 = W + 250;
  const frameGap = frameW + Math.max(70, W * 0.10);

  frames = ART.map((a, i) => {
    const cx = galleryX0 + frameW / 2 + i * frameGap;
    return { art: a, cx, w: frameW, h: frameH };
  });

  const lastRight = frames[frames.length - 1].cx + frameW / 2;
  WORLD_W = lastRight + 190;
  galleryMidX = (galleryX0 + lastRight) / 2;

  guy.x = clamp(guy.x, 20, WORLD_W - 20);
}
window.addEventListener("resize", resize);
resize();

function hitBox(mx, my) {
  for (const p of pipeLayout) {
    if (mx >= p.boxX && mx <= p.boxX + p.boxW && my >= p.boxTop && my <= p.boxTop + p.boxH)
      return p;
    if (mx >= p.pipeX && mx <= p.pipeX + p.pipeW && my >= groundY - p.pipeH && my <= groundY)
      return p;
  }
  return null;
}

canvas.addEventListener("mousemove", (e) => {
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left + camX;
  const my = e.clientY - r.top;
  canvas.style.cursor = hitBox(mx, my) ? "pointer" : "default";
});

canvas.addEventListener("click", (e) => {
  if (guy.entering) return;
  const r = canvas.getBoundingClientRect();
  const p = hitBox(e.clientX - r.left + camX, e.clientY - r.top);
  if (p) {
    guy.entering = true;
    guy.enterT = 0;
    guy.targetUrl = p.url;
    guy.x = p.cx;
    guy.vx = 0;
    guy.yOff = 0;
    guy.vy = 0;
    guy.onGround = true;
  }
});

function nearestPipe() {
  let best = null, bd = 1e9;
  for (const p of pipeLayout) {
    const d = Math.abs(guy.x - p.cx);
    if (d < bd) { bd = d; best = p; }
  }
  return { p: best, d: bd };
}

function tryEnter() {
  if (!guy.onGround) return;
  const { p, d } = nearestPipe();
  if (p && d < 34) {
    guy.entering = true;
    guy.enterT = 0;
    guy.targetUrl = p.url;
    guy.x = p.cx;
    guy.vx = 0;
  }
}

function update() {
  if (guy.entering) {
    guy.enterT += 0.02;
    if (guy.enterT >= 1) window.location.href = guy.targetUrl;
    return;
  }
  let dir = 0;
  if (keys["ArrowLeft"] || keys["a"] || keys["A"]) dir -= 1;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) dir += 1;
  guy.vx = dir * guy.speed;
  guy.x += guy.vx;
  guy.x = clamp(guy.x, 20, WORLD_W - 20);

  guy.vy += GRAV;
  guy.yOff += guy.vy;
  if (guy.yOff >= 0) {
    guy.yOff = 0;
    guy.vy = 0;
    guy.onGround = true;
  }

  // which picture are we standing under?
  activeArt = null;
  if (guy.onGround) {
    let bd = 1e9;
    for (const f of frames) {
      const d = Math.abs(guy.x - f.cx);
      if (d < f.w * 0.58 && d < bd) { bd = d; activeArt = f; }
    }
  }
  if (activeArt) shownArt = activeArt;
  previewT += ((activeArt ? 1 : 0) - previewT) * 0.14;
  hintEl.style.opacity = previewT > 0.05 ? "0" : "0.9";
}

let t = 0;
function draw() {
  t += 1;

  const targetCam = clamp(guy.x - W / 2, 0, Math.max(0, WORLD_W - W));
  camX += (targetCam - camX) * 0.16;
  if (Math.abs(targetCam - camX) < 0.4) camX = targetCam;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, W, H);

  // ---------- world space ----------
  ctx.save();
  ctx.translate(-camX, 0);

  ctx.strokeStyle = "#000";
  ctx.fillStyle = "#000";
  ctx.lineWidth = 2;
  ctx.textAlign = "center";

  ctx.font = "38px 'Comic Sans MS', 'Segoe Print', cursive";
  ctx.fillText("SORTAFUN.ORG", menuMidX, 56);

  ctx.font = "30px 'Comic Sans MS', 'Segoe Print', cursive";
  ctx.fillText("art gallery", galleryMidX, 52);

  // signposts in the gap between the two rooms
  ctx.font = "15px 'Comic Sans MS', 'Segoe Print', cursive";
  ctx.fillStyle = "#999";
  ctx.textAlign = "left";
  ctx.fillText("the art gallery, this way  →", W + 40, groundY - 42);
  ctx.fillText("←  back to the lobby", W + 40, groundY - 16);
  ctx.textAlign = "center";
  ctx.fillStyle = "#000";

  // menu boxes
  ctx.font = "17px 'Comic Sans MS', 'Segoe Print', cursive";
  for (const p of pipeLayout) {
    roundRect(p.boxX, p.boxTop, p.boxW, p.boxH, 12);
    ctx.stroke();
    const words = p.label.split(" ");
    const lines = [];
    let cur = "";
    for (const w of words) {
      if ((cur + " " + w).trim().length > 12) { lines.push(cur.trim()); cur = w; }
      else cur += " " + w;
    }
    if (cur.trim()) lines.push(cur.trim());
    const ly = p.boxTop + p.boxH / 2 - (lines.length - 1) * 11 + 5;
    lines.forEach((ln, i) => ctx.fillText(ln, p.cx, ly + i * 22));
  }

  // gallery frames on the wall
  for (const f of frames) {
    drawFrame(f);
  }

  // a little potted plant by the gallery door, for coziness
  drawPlant(frames[0].cx - frames[0].w / 2 - 34, groundY);

  // pipes poking out of the floor
  const { p: near, d: nearD } = nearestPipe();
  for (const p of pipeLayout) {
    ctx.fillStyle = "#1faf3a";
    ctx.fillRect(p.pipeX, groundY - p.pipeH, p.pipeW, p.pipeH);
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.strokeRect(p.pipeX, groundY - p.pipeH, p.pipeW, p.pipeH);
    if (p === near && nearD < 34 && guy.onGround && !guy.entering) {
      ctx.fillStyle = "#000";
      ctx.font = "20px 'Comic Sans MS', cursive";
      ctx.fillText("↓", p.cx, groundY - p.pipeH - 10);
      ctx.font = "17px 'Comic Sans MS', 'Segoe Print', cursive";
    }
  }

  drawGuy();

  ctx.restore();
  // ---------- /world space ----------

  // floor line — continuous everywhere, so it stays in screen space
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();

  drawPreview();

  requestAnimationFrame(loop);
}

// cover-fit an image into a rect, cropping the overflow
function drawImageCover(img, x, y, w, h) {
  if (!img.complete || !img.naturalWidth) {
    ctx.fillStyle = "#eee";
    ctx.fillRect(x, y, w, h);
    return;
  }
  const ir = img.naturalWidth / img.naturalHeight;
  const rr = w / h;
  let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
  if (ir > rr) { sw = sh * rr; sx = (img.naturalWidth - sw) / 2; }
  else { sh = sw / rr; sy = (img.naturalHeight - sh) / 2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

function drawFrame(f) {
  const x = f.cx - f.w / 2;
  const y = wallTop + 6;

  // hanging wire
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(f.cx - f.w * 0.28, y);
  ctx.lineTo(f.cx, y - 16);
  ctx.lineTo(f.cx + f.w * 0.28, y);
  ctx.stroke();

  // frame + mat + photo
  ctx.fillStyle = "#000";
  ctx.fillRect(x - 6, y - 6, f.w + 12, f.h + 12);
  ctx.fillStyle = "#fff";
  ctx.fillRect(x - 3, y - 3, f.w + 6, f.h + 6);
  drawImageCover(f.art.img, x, y, f.w, f.h);
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, f.w, f.h);

  // illegible plaque under the frame
  const pw = 96, ph = 26;
  const py = y + f.h + 12;
  ctx.fillStyle = "#fff";
  ctx.fillRect(f.cx - pw / 2, py, pw, ph);
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(f.cx - pw / 2, py, pw, ph);
  squiggle(f.cx - pw / 2 + 8, py + 9, pw - 16, 1.4, 3);
  squiggle(f.cx - pw / 2 + 8, py + 17, pw - 22, 1.4, 3);
}

// a wobbly horizontal scribble standing in for text
function squiggle(x, y, w, amp, waves) {
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  const steps = Math.max(12, Math.floor(w / 4));
  for (let i = 0; i <= steps; i++) {
    const px = x + (w * i) / steps;
    const py = y + Math.sin((i / steps) * Math.PI * 2 * waves) * amp;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();
}

function drawPlant(x, baseY) {
  ctx.strokeStyle = "#000";
  ctx.fillStyle = "#fff";
  ctx.lineWidth = 2;
  // pot
  ctx.beginPath();
  ctx.moveTo(x - 12, baseY - 20);
  ctx.lineTo(x + 12, baseY - 20);
  ctx.lineTo(x + 8, baseY);
  ctx.lineTo(x - 8, baseY);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // leaves
  ctx.beginPath();
  ctx.moveTo(x, baseY - 20);
  ctx.quadraticCurveTo(x - 16, baseY - 34, x - 6, baseY - 48);
  ctx.moveTo(x, baseY - 20);
  ctx.quadraticCurveTo(x + 16, baseY - 34, x + 6, baseY - 48);
  ctx.moveTo(x, baseY - 20);
  ctx.lineTo(x, baseY - 44);
  ctx.stroke();
}

function drawPreview() {
  if (previewT < 0.02 || !shownArt) return;

  const bandH = H - groundY;
  const ease = 1 - Math.pow(1 - previewT, 2);
  const slide = (1 - ease) * bandH;
  const alpha = clamp(previewT * 1.4, 0, 1);

  ctx.save();
  ctx.globalAlpha = alpha;

  const pad = 14;
  const photoH = Math.min(bandH - pad * 2, 240);
  const photoW = photoH * ART_RATIO;
  const capW = Math.min(W * 0.32, 300);
  const total = photoW + 26 + capW;
  const x0 = (W - total) / 2;
  const y0 = groundY + pad + slide;

  // photo, contained, framed
  ctx.fillStyle = "#000";
  ctx.fillRect(x0 - 4, y0 - 4, photoW + 8, photoH + 8);
  const img = shownArt.art.img;
  if (img.complete && img.naturalWidth) {
    ctx.drawImage(img, x0, y0, photoW, photoH);
  } else {
    ctx.fillStyle = "#eee";
    ctx.fillRect(x0, y0, photoW, photoH);
  }

  // illegible caption block
  const cx = x0 + photoW + 26;
  const lines = 4;
  for (let i = 0; i < lines; i++) {
    const ly = y0 + 14 + (photoH - 24) * (i / (lines - 1));
    squiggle(cx, ly, capW * (i === lines - 1 ? 0.55 : 0.92), 2, 4 + i);
  }

  ctx.restore();
}

function drawGuy() {
  ctx.save();
  ctx.strokeStyle = "#000";
  ctx.fillStyle = "#fff";
  ctx.lineWidth = 2;

  let feetY = groundY + guy.yOff;
  let bob = 0;
  if (!guy.entering && guy.vx !== 0 && guy.onGround) bob = Math.sin(t * 0.3) * 2;
  const airborne = !guy.onGround && !guy.entering;

  if (guy.entering) {
    const { p } = nearestPipe();
    feetY = groundY + guy.enterT * 60;
    ctx.beginPath();
    ctx.rect(p.pipeX - 1, groundY - p.pipeH, p.pipeW + 2, p.pipeH + 62);
    ctx.clip();
  }

  const x = guy.x;
  const headR = 9;
  const headCY = feetY - 46 + bob;
  const hipY = feetY - 20 + bob;

  ctx.beginPath();
  ctx.arc(x, headCY, headR, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x, headCY + headR);
  ctx.lineTo(x, hipY);
  ctx.stroke();

  const swing = airborne ? -8 : (guy.vx !== 0 ? Math.sin(t * 0.3) * 6 : 3);
  ctx.beginPath();
  ctx.moveTo(x, hipY - 14);
  ctx.lineTo(x - 9, hipY - 6 + swing);
  ctx.moveTo(x, hipY - 14);
  ctx.lineTo(x + 9, hipY - 6 - swing);
  ctx.stroke();

  let legSwing;
  if (airborne) legSwing = guy.vy < 0 ? 3 : 9;
  else legSwing = guy.vx !== 0 ? Math.sin(t * 0.3) * 7 : 5;
  ctx.beginPath();
  ctx.moveTo(x, hipY);
  ctx.lineTo(x - legSwing, feetY + bob);
  ctx.moveTo(x, hipY);
  ctx.lineTo(x + legSwing, feetY + bob);
  ctx.stroke();

  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function loop() {
  update();
  draw();
}
loop();
</script>
</body>
</html>
