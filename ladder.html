<body>
<div class="wrap">
  <h1>word ladder</h1>
  <p class="sub">change one letter at a time, every step a real four letter word, from the green word to the red word. same ladder for everyone today. fewest rungs wins.</p>

  <div class="ends"><span id="startW" class="start">----</span><span class="to">to</span><span id="endW" class="end">----</span></div>
  <p class="meta">par <span id="par">?</span> rungs</p>

  <ol id="chain"></ol>

  <div id="entry">
    <input id="word" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="next">
    <button id="add">add rung</button>
    <button id="undo">undo</button>
  </div>

  <div class="status" id="status"></div>
  <div id="lb"></div>

  <a class="back" href="index.html">&larr; back up the pipe</a>
</div>

<script src="firebase-config.js"></script>

var SET = Object.create(null);
WORDS.forEach(function (w) { SET[w] = true; });

// adjacency: one letter different, same length
function neighbors(w) {
  var out = [];
  for (var i = 0; i < 4; i++) {
    for (var c = 97; c < 123; c++) {
      var ch = String.fromCharCode(c);
      if (ch === w[i]) continue;
      var nw = w.slice(0, i) + ch + w.slice(i + 1);
      if (SET[nw]) out.push(nw);
    }
  }
  return out;
}

function bfs(a, b) {
  if (a === b) return [a];
  var q = [[a]], seen = Object.create(null);
  seen[a] = true;
  while (q.length) {
    var path = q.shift();
    var last = path[path.length - 1];
    var nb = neighbors(last);
    for (var i = 0; i < nb.length; i++) {
      if (seen[nb[i]]) continue;
      if (nb[i] === b) return path.concat([b]);
      seen[nb[i]] = true;
      q.push(path.concat([nb[i]]));
    }
    if (path.length > 9) return null;
  }
  return null;
}

// seeded RNG from the Singapore day, same clock the site uses
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function daySeed() {
  var s = (window.SortafunLB ? SortafunLB.dayStr() : new Date().toISOString().slice(0, 10));
  return Number(s.replace(/-/g, ""));
}

var startW, endW, par, chain;
var startEl = document.getElementById("startW");
var endEl = document.getElementById("endW");
var parEl = document.getElementById("par");
var chainEl = document.getElementById("chain");
var wordEl = document.getElementById("word");
var statusEl = document.getElementById("status");
var lbEl = document.getElementById("lb");

function makePuzzle() {
  var rnd = mulberry32(daySeed());
  var pool = WORDS.filter(function (w) { return neighbors(w).length >= 2; });
  for (var attempt = 0; attempt < 400; attempt++) {
    var a = pool[(rnd() * pool.length) | 0];
    // random walk 4..6 steps, no immediate backtrack
    var path = [a], steps = 4 + ((rnd() * 3) | 0);
    var ok = true;
    for (var s = 0; s < steps; s++) {
      var nb = neighbors(path[path.length - 1]).filter(function (x) { return path.indexOf(x) === -1; });
      if (!nb.length) { ok = false; break; }
      path.push(nb[(rnd() * nb.length) | 0]);
    }
    if (!ok) continue;
    var b = path[path.length - 1];
    if (b === a) continue;
    var best = bfs(a, b);
    if (best && best.length >= 4 && best.length <= 7) {
      startW = a; endW = b; par = best.length - 1;
      return;
    }
  }
  // extremely unlikely fallback
  startW = "cold"; endW = "warm"; par = (bfs("cold", "warm") || ["", "", "", "", ""]).length - 1;
}

function render() {
  chainEl.innerHTML = "";
  chain.forEach(function (w, i) {
    var li = document.createElement("li");
    li.textContent = w.split("").join(" ");
    if (i === 0) li.className = "start";
    if (w === endW && i > 0) li.className = "end";
    chainEl.appendChild(li);
  });
  var last = chain[chain.length - 1];
  if (last === endW) win();
}

function add() {
  var w = wordEl.value.trim().toLowerCase();
  wordEl.classList.remove("bad");
  var last = chain[chain.length - 1];
  if (last === endW) return;
  var why = "";
  if (w.length !== 4) why = "four letters";
  else if (!SET[w]) why = "not in the word list";
  else if (chain.indexOf(w) !== -1) why = "already used that one";
  else {
    var diff = 0;
    for (var i = 0; i < 4; i++) if (w[i] !== last[i]) diff++;
    if (diff !== 1) why = "change exactly one letter from " + last.toUpperCase();
  }
  if (why) { wordEl.classList.add("bad"); statusEl.textContent = why; return; }
  statusEl.textContent = "";
  chain.push(w);
  wordEl.value = "";
  wordEl.focus();
  render();
}

function win() {
  var rungs = chain.length - 1;
  statusEl.textContent = "solved in " + rungs + " rung" + (rungs === 1 ? "" : "s") +
    (rungs === par ? " — that is par" : rungs < par ? " — under par!" : "");
  wordEl.disabled = true;
  document.getElementById("add").disabled = true;
  lbEl.innerHTML = "";
  if (window.SortafunLB) SortafunLB.mountPanel(lbEl, "ladder", { score: rungs });
  else lbEl.textContent = "leaderboard offline";
}

function start() {
  makePuzzle();
  chain = [startW];

  startEl.textContent = startW.toUpperCase().split("").join(" ");
  endEl.textContent = endW.toUpperCase().split("").join(" ");
  parEl.textContent = par;
  wordEl.disabled = false;
  document.getElementById("add").disabled = false;
  render();
  wordEl.focus();
}

document.getElementById("add").addEventListener("click", add);
document.getElementById("undo").addEventListener("click", function () {
  if (chain.length > 1 && chain[chain.length - 1] !== endW) { chain.pop(); render(); }
});
wordEl.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); add(); } });
start();
</script>
