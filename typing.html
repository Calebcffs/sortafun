<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>typing game &middot; SORTAFUN.ORG</title>
<link rel="stylesheet" href="game.css">
<style>
  .diffbar { display: flex; gap: 0; justify-content: center; margin: 6px 0 2px; }
  .diffbar button { border-radius: 0; font-size: 13px; padding: 4px 12px; }
  .diffbar button:first-child { border-radius: 8px 0 0 8px; }
  .diffbar button:last-child { border-radius: 0 8px 8px 0; border-left-width: 1px; }
  .diffbar button.on { background: #ffe9a8; }
  #stream {
    font-size: 24px;
    line-height: 1.8;
    min-height: 76px;
    margin: 10px auto 4px;
    max-width: 520px;
    word-spacing: 6px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: clip;
  }
  .w { padding: 2px 4px; border-radius: 5px; }
  .w.cur { background: #ffe9a8; }
  #field {
    font-size: 22px;
    padding: 8px 12px;
    border: 2px solid #000;
    border-radius: 8px;
    width: 260px;
    text-align: center;
    outline: none;
    transition: background .1s ease;
  }
  #field.bad { background: #f7d6d6; }
  #field.ok { background: #d3f5d3; }
  #field.miss { background: #f7d6d6; }
  .hud {
    display: flex;
    gap: 20px;
    justify-content: center;
    font-size: 16px;
    margin: 10px 0 4px;
  }
  .big { font-size: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>typing game</h1>
  <p class="sub">type the first word, hit space. it never moves, the next one slides into its place. 30 seconds.</p>

  <div class="diffbar" role="group" aria-label="word list">
    <button data-diff="200" class="on">top 200 words</button>
    <button data-diff="1000">top 1000 words</button>
  </div>
  <p class="sub" id="diffnote" style="margin-top:2px;">easier: the 200 most common english words</p>

  <div class="hud">
    <span>time <b id="time" class="big">30</b></span>
    <span>words <b id="count" class="big">0</b></span>
    <span>wpm <b id="wpm" class="big">0</b></span>
  </div>

  <div id="stream"></div>
  <input id="field" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type here">

  <div class="status" id="status"></div>
  <div><button id="restart">restart</button></div>

  <div id="lb"></div>

  <a class="back" href="index.html">&larr; back up the pipe</a>
</div>

<script src="words.js"></script>
<script src="firebase-config.js"></script>
<script src="leaderboard.js"></script>
<script>
"use strict";

// word.js provides the real banks; this is a small fallback for file:// / offline.
var FALLBACK = ("the of and to a in for is on that by this with you it not or be are from at as your all " +
  "new more an was we will home can us about if page my has search free but our one other do no time they " +
  "site he up may what which their news out use any there see only so his when here who web also now help get").split(/\s+/);

var WORDS = (window.SORTAFUN_WORDS && window.SORTAFUN_WORDS.top200)
  ? window.SORTAFUN_WORDS
  : { top200: FALLBACK, top1000: FALLBACK };

var DIFF_KEY = "sortafun-typing-diff";
var diff = "200";
try {
  var stored = localStorage.getItem(DIFF_KEY);
  if (stored === "200" || stored === "1000") diff = stored;
} catch (e) {}

function bank() { return diff === "1000" ? WORDS.top1000 : WORDS.top200; }
function gameKey() { return diff === "1000" ? "typing1000" : "typing"; }

var streamEl = document.getElementById("stream");
var field = document.getElementById("field");
var timeEl = document.getElementById("time");
var countEl = document.getElementById("count");
var wpmEl = document.getElementById("wpm");
var statusEl = document.getElementById("status");
var diffNote = document.getElementById("diffnote");
var diffBtns = document.querySelectorAll(".diffbar button");

var WINDOW = 12;                     // words kept queued at once
var words, correctChars, count, startTime, timer, running, ended, flashT;

function rndWord() {
  var b = bank();
  return b[(Math.random() * b.length) | 0];
}

function syncDiffUI() {
  diffBtns.forEach(function (b) { b.classList.toggle("on", b.dataset.diff === diff); });
  diffNote.textContent = diff === "1000"
    ? "harder: the 1000 most common english words, own leaderboard"
    : "easier: the 200 most common english words";
}

function reset() {
  words = [];
  for (var i = 0; i < WINDOW; i++) words.push(rndWord());
  correctChars = 0;
  count = 0;
  startTime = null;
  running = false;
  ended = false;
  clearInterval(timer);
  clearTimeout(flashT);
  timeEl.textContent = "30";
  countEl.textContent = "0";
  wpmEl.textContent = "0";
  statusEl.textContent = "";
  field.value = "";
  field.className = "";
  field.disabled = false;
  document.getElementById("lb").innerHTML = "";
  syncDiffUI();
  render();
  field.focus();
}

// the first span is always the word you type, and it never moves. the rest
// slide left as words are cleared off the front.
function render() {
  streamEl.innerHTML = "";
  words.forEach(function (w, i) {
    var span = document.createElement("span");
    span.className = "w" + (i === 0 ? " cur" : "");
    span.textContent = w;
    streamEl.appendChild(span);
    streamEl.appendChild(document.createTextNode(" "));
  });
}

function flash(ok) {
  field.classList.remove("ok", "miss");
  void field.offsetWidth;
  field.classList.add(ok ? "ok" : "miss");
  clearTimeout(flashT);
  flashT = setTimeout(function () { field.classList.remove("ok", "miss"); }, 150);
}

function tick() {
  var left = 30 - (Date.now() - startTime) / 1000;
  if (left <= 0) { timeEl.textContent = "0"; finish(); return; }
  timeEl.textContent = left.toFixed(1);
  var mins = (Date.now() - startTime) / 60000;
  wpmEl.textContent = mins > 0 ? Math.round((correctChars / 5) / mins) : 0;
}

function finish() {
  ended = true;
  running = false;
  clearInterval(timer);
  field.disabled = true;
  var wpm = Math.round((correctChars / 5) / 0.5);
  statusEl.textContent = "time! " + count + " words · " + wpm + " wpm 🟩";
  wpmEl.textContent = wpm;
  showBoard(wpm);
}

function showBoard(score) {
  var lb = document.getElementById("lb");
  lb.innerHTML = "";
  if (window.SortafunLB) {
    SortafunLB.mountPanel(lb, gameKey(), { score: score });
  } else {
    lb.textContent = "leaderboard offline";
  }
}

field.addEventListener("input", function () {
  if (ended) return;
  if (!running) {
    running = true;
    startTime = Date.now();
    timer = setInterval(tick, 100);
  }
  var target = words[0];
  field.classList.toggle("bad", !target.startsWith(field.value.trimStart()));
});

field.addEventListener("keydown", function (e) {
  if (e.key !== " " && e.key !== "Enter") return;
  e.preventDefault();
  if (ended) return;
  var typed = field.value.trim();
  if (typed.length === 0) return;
  var target = words[0];
  var ok = typed === target;
  if (ok) {
    correctChars += target.length + 1;
    count++;
    countEl.textContent = count;
  }
  flash(ok);
  words.shift();
  words.push(rndWord());
  field.value = "";
  field.classList.remove("bad");
  render();
});

diffBtns.forEach(function (b) {
  b.addEventListener("click", function () {
    if (b.dataset.diff === diff) return;
    diff = b.dataset.diff;
    try { localStorage.setItem(DIFF_KEY, diff); } catch (e) {}
    reset();
  });
});

document.getElementById("restart").addEventListener("click", reset);
reset();
</script>
</body>
</html>
