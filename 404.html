<div class="wrap">
  <h1>page not found</h1>
  <p class="big">404</p>
  <p class="sub">the guy walked off the edge looking for this page. there's nothing here.</p>
  <canvas id="c"></canvas>
  <a class="back" href="/index.html">&larr; back up the pipe</a>
</div>

<script>
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let W, H, t = 0;
function resize() { W = cv.width = cv.clientWidth; H = cv.height = cv.clientHeight; }
addEventListener("resize", resize);
resize();

// the guy falls forever past a broken floor edge
const guy = { x: 0, y: 0, vy: 0 };
function reset() { guy.x = W * 0.5; guy.y = H * 0.3; guy.vy = 0; }
reset();

function loop() {
  t++;
  ctx.clearRect(0, 0, W, H);

  const floorY = H * 0.36;
  // the broken floor: solid on the left, jagged stop in the middle
  ctx.fillStyle = "#8ce99a";
  ctx.strokeStyle = "#1d1b2e";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, floorY);
  ctx.lineTo(W * 0.42, floorY);
  ctx.lineTo(W * 0.44, floorY + 10);
  ctx.lineTo(W * 0.45, floorY - 4);
  ctx.lineTo(W * 0.46, floorY + 16);
  ctx.lineTo(W * 0.40, floorY + 26);
  ctx.lineTo(0, floorY + 26);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // falling guy
  guy.vy += 0.3;
  guy.y += guy.vy;
  guy.x += Math.sin(t * 0.05) * 0.6;
  if (guy.y > H + 60) reset();

  ctx.save();
  ctx.translate(guy.x, guy.y);
  ctx.rotate(Math.sin(t * 0.08) * 0.5);
  ctx.strokeStyle = "#1d1b2e";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(0, -22, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, -14); ctx.lineTo(0, 6);
  ctx.moveTo(0, -8); ctx.lineTo(-11, -16);
  ctx.moveTo(0, -8); ctx.lineTo(12, -15);
  ctx.moveTo(0, 6); ctx.lineTo(-9, 20);
  ctx.moveTo(0, 6); ctx.lineTo(10, 19);
  ctx.stroke();
  ctx.restore();

  // motion lines
  ctx.strokeStyle = "#a5d8ff";
  ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const lx = guy.x - 20 + i * 10;
    ctx.beginPath();
    ctx.moveTo(lx, guy.y - 60);
    ctx.lineTo(lx, guy.y - 30);
    ctx.stroke();
  }

  requestAnimationFrame(loop);
}
loop();
</script>
