<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>guestbook &middot; SORTAFUN.ORG</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="game.css?v=078c46a8">
<style>
  .blink { animation: bl 1s steps(1) infinite; color: #e03131; font-weight: bold; }
  @keyframes bl { 50% { opacity: 0; } }
  form {
    text-align: left; border: 3px solid var(--ink); border-radius: 12px;
    padding: 12px 14px; background: #fff9db; margin-bottom: 18px;
  }
  label { display: block; margin: 8px 0 3px; font-weight: bold; font-size: 13px; }
  form input, form textarea { width: 100%; }
  textarea { height: 80px; resize: vertical; }
  #go {
    margin-top: 10px; font-family: var(--chunky); font-weight: 400; font-size: 17px; color: #fff;
    text-shadow: 0 1px 0 rgba(0,0,0,.3); background: linear-gradient(#5cf08e, #18a84b); border-radius: 999px; padding: 5px 20px 4px;
  }
  #go:hover { background: linear-gradient(#ffe36e, #ffb300); color: var(--ink); text-shadow: none; }
  #list { text-align: left; }
  .entry {
    border: 2.5px solid var(--ink); border-radius: 12px; padding: 9px 12px; margin: 0 0 10px;
    background: #fff; box-shadow: 0 3px 0 rgba(29,27,46,.2);
  }
  .entry:nth-child(odd) { background: var(--soft); }
  .entry .who { font-weight: bold; color: var(--accent); }
  .entry .when { color: #8a879c; font-size: 11px; }
  .entry .msg { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; }
  .msgline { color: var(--muted); font-size: 13px; min-height: 18px; }
  hr { border: 0; border-top: 3px dotted #c5cbe0; margin: 4px 0 14px; }
</style>
<script src="sfx.js?v=fb4567ef"></script>
</head>
<body class="k-hang">
<header class="homebar"><a class="hb-logo" href="index.html">SORTAFUN<small>.org</small></a><nav class="hb-nav"><a class="n-games" href="index.html#games">Games</a><a class="n-art" href="index.html#art">Art</a><a class="n-hang" href="index.html#hangout">Hangout</a><a class="n-base" href="index.html#basement">Basement</a></nav></header>
<div class="wrap">
  <h1>~ sign my guestbook ~</h1>
  <p class="sub">you are visitor. leave a mark. <span class="blink">NEW</span> messages daily (maybe). no take-backs, it's written in pen.</p>

  <form id="form">
    <label for="gb-name">your name / handle</label>
    <input id="gb-name" maxlength="30" autocomplete="off" placeholder="e.g. xX_griefer_Xx">
    <label for="gb-msg">your message</label>
    <textarea id="gb-msg" maxlength="400" placeholder="be nice. or don't."></textarea>
    <button type="submit" id="go">sign it</button>
    <span class="msgline" id="msgline"></span>
  </form>

  <hr>
  <div id="list"><p class="msgline">loading the book...</p></div>
  <div style="text-align:center;margin-top:10px"><button id="more" style="display:none">older entries</button></div>

  <a class="back" href="index.html">&larr; back up the pipe</a>
</div>

<script src="firebase-config.js?v=4115083e"></script>
<script src="leaderboard.js?v=23697025"></script>
<script>
"use strict";

var form = document.getElementById("form");
var nameEl = document.getElementById("gb-name");
var msgEl = document.getElementById("gb-msg");
var go = document.getElementById("go");
var msgline = document.getElementById("msgline");
var listEl = document.getElementById("list");
var moreBtn = document.getElementById("more");

var cursor = null, loading = false;

try { nameEl.value = localStorage.getItem("sortafun-name") || ""; } catch (e) {}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function when(ts) {
  if (window.SortafunLB && SortafunLB.fmtWhen) {
    var w = SortafunLB.fmtWhen(ts);
    if (w) return w;
  }
  return "just now";
}

function addEntries(rows, append) {
  if (!append) listEl.innerHTML = "";
  if (!rows.length && !append) {
    listEl.innerHTML = '<p class="msgline">nobody has signed yet. go on.</p>';
    return;
  }
  rows.forEach(function (r) {
    var d = document.createElement("div");
    d.className = "entry";
    d.innerHTML = '<div><span class="who">' + esc(r.name) + '</span> ' +
      '<span class="when">' + esc(when(r.ts)) + '</span></div>' +
      '<div class="msg">' + esc(r.msg) + '</div>';
    listEl.appendChild(d);
    cursor = r._cursor;
  });
  moreBtn.style.display = rows.length >= 40 ? "" : "none";
}

function load(append) {
  if (loading || !window.SortafunLB) {
    if (!window.SortafunLB) listEl.innerHTML = '<p class="msgline">guestbook offline</p>';
    return;
  }
  loading = true;
  SortafunLB.guestbookList(40, append ? cursor : null).then(function (rows) {
    loading = false;
    addEntries(rows, append);
  }).catch(function (e) {
    loading = false;
    listEl.innerHTML = '<p class="msgline">could not load the book</p>';
    console.warn(e);
  });
}

form.addEventListener("submit", function (e) {
  e.preventDefault();
  var name = nameEl.value.trim(), msg = msgEl.value.trim();
  if (!name || !msg) { msgline.textContent = "need a name and a message"; return; }
  if (!window.SortafunLB) { msgline.textContent = "guestbook offline"; return; }
  go.disabled = true;
  msgline.textContent = "signing...";
  try { localStorage.setItem("sortafun-name", name); } catch (err) {}
  SortafunLB.guestbookSign(name, msg).then(function () {
    go.disabled = false;
    try { localStorage.setItem("sortafun-stamp-guestbook", "1"); } catch (err2) {}
    msgline.textContent = "signed. thanks.";
    if (window.SortafunSFX) SortafunSFX.play("coin");
    msgEl.value = "";
    cursor = null;
    load(false);
  }).catch(function (err) {
    go.disabled = false;
    msgline.textContent = "did not go through: " + (err && err.message || "error");
  });
});

moreBtn.addEventListener("click", function () { load(true); });
load(false);
</script>
<footer class="sitefoot">&copy; 2026 <a href="index.html">sortafun.org</a> &middot; all games free forever &middot; no downloads, no sign-up</footer>
</body>
</html>
